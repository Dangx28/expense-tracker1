<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenses</title>
  </head>
  <body>
    <form action="api/add_expense.php" method="post">
      <label>Category</label>
      <select name="category">
        <option value="">Pick Bro</option>
      </select>
      <br />
      <label>Amount</label>
      <input type="number" name="amount" />
      <br />
      <label>Description</label>
      <input type="text" name="desc" />
      <br />
      <label>Expense Date</label>
      <input type="date" name="exp-date" />
      <br />
      <input type="submit" />
    </form>

    <table id="expense_table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Amount</th>
          <th>Description</th>
          <th>Category Name</th>
          <th>Expense Date</th>
        </tr>
      </thead>
      <tbody id="expense_tb"></tbody>
    </table>

    <button id="load_button">Load Expenses</button>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
